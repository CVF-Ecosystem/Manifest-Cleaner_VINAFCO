[General]
log_file_name = manifest_processor.log
excel_engine_xlsx = openpyxl
excel_engine_xls = xlrd
peek_rows = 30
output_sheet_name = Processed_Manifest
max_column_width = 50
language = vi

[VinafcoSpecific]
target_sheet_name = MANIFEST
party_marker_len = 3
operator_soc = SVF
operator_coc = VFC
expected_input_columns_lower =
    party_raw:(s) shipper,(c) consignee,(n)notify party
    bill_no:bill no
input_column_names =
    party_raw:(S) SHIPPER,(C) CONSIGNEE,(N)NOTIFY PARTY
    bill_no:Bill No
    container_no:CONTAINER No.
    seal:SEAL
    type:TYPE
    comm:COM.M
    gw:GW
    remarks:REMARKS
output_column_mapping =
    Số lượng_temp:Số lượng
    BL_No:Số BL
    Container_No:Số Container
    Operator:Hãng khai thác
    Size_Type:Kích cỡ
    ISO_Size:Kích cỡ VTOS
    FE_Status:F/E
    Weight_Value:TL hàng
    Seal_No:Số niêm chì
    Cleaned_Consignee_Name_For_Output:Chủ hàng
    Description:Hàng hóa
    Cargo_Type:Loại hàng
    Confidence:Độ chính xác (%)
    Warning:Ghi chú
    
desired_output_columns = STT, Số lượng, Số BL, Số Container, Hãng khai thác, Kích cỡ, Kích cỡ VTOS, F/E, TL hàng, Số niêm chì, Số niêm chì 1, Chủ hàng, Hàng hóa, Loại hàng, Độ chính xác (%), Ghi chú
seal_column_output_name = Số niêm chì
consignee_column_output_name = Chủ hàng
fe_column_output_name = F/E
temp_count_column_name = Số lượng_temp
default_weight_unit_if_missing = TONS
