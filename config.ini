seal_column_output_name = Số niêm chì
consignee_column_output_name = Chủ hàng
fe_column_output_name = F/E
temp_count_column_name = Số lượng_temp

[LogicThresholds]
# Dùng cho Vinafco (VGM)
tare_40ft_empty_vgm = 3.8
tare_20ft_empty_vgm = 2.3
tare_40rf_empty_vgm = 4.8
tare_20rf_empty_vgm = 3.0
min_payload_for_f_vgm = 0.1  
# (Tấn) Payload tối thiểu để VGM được coi là F

# Dùng cho VIMC (Cargo Weight)
cargo_weight_empty_threshold = 0.05 
# (Tấn) Nếu Cargo Weight <= ngưỡng này, coi là E
[RegexPatterns]
container_no = ^([A-Z]{4}\d{7})
stop_keywords_party_name = (?:Mail\s*:|Tel\s*:|Fax\s*:|Địa chỉ\s*:|SĐT\s*:|Email\s*:|Số CCCD\s*:|Tại\s*:|Chức vụ\s*:|Tài khoản\s*:|Đ/C\s*:|MST\s*:|Phone\s*:|Email\s*\:|Điện thoại\s*:)
size_type_in_shipper_line = \(\d+x[A-Z0-9\']+\)
soc_marker_in_shipper_line = /S\.O\.C|SOC
empty_description = EMPTY|RỖNG|CHUYEN RONG
weight_vinafco = ^([\d\.,]+)\s*(KGS|KG|TONS|TON|T)?$

[Mappings]
size_to_iso =
    20TK:20TK
    20DC:20DC
    40DC:40DC
    40HC:40HC
    45HC:45HC
    20RF:20RF
    20RH:20RH
    40RF:40RF
    40RH:40RH
    45RF:45RF
    45RH:45RH
    20GP:20GP
    40GP:40HC
    45GP:45HC
    20FR:20FL
    40FR:40FL
    20OT:20OT
    40OT:40OT
[CargoTypeMapping]
# Mapping từ Size_Type (hoặc ISO_Size nếu bạn muốn) sang loại hàng cơ bản
# Key là Size_Type (ví dụ: 20TK, 20DC, 20RF, 20FR, 20OT)
# Value là loại hàng cơ bản (ví dụ: TANK, GENERAL, REEFER, FLATRACK, OPENTOP)
# Chúng ta sẽ dùng Size_Type đầu vào làm key vì nó có vẻ nhất quán hơn cho việc này.
# Nếu Size_Type không có trong mapping này, mặc định sẽ là "GENERAL"
20TK: TANK
20DC: GENERAL
40DC: GENERAL
40HC: GENERAL
45HC: GENERAL
20RF: REEFER
40RF: REEFER
45RF: REEFER
20GP: GENERAL # GP cũng là General
40GP: GENERAL
45GP: GENERAL
20FR: FLATRACK
40FR: FLATRACK
20OT: OPENTOP
40OT: OPENTOP
# Thêm các loại khác nếu cần

[Formatting]
seal_invalid_bg_color = #FFFF00
empty_container_bg_color = #DAEEF3